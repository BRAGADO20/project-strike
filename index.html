<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>SPEC OPS: SAVANNA SURVIVAL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; user-select: none; -webkit-user-select: none; }
        body { background: #000; overflow: hidden; width: 100vw; height: 100vh; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        /* MENU */
        #menu-screen { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle, #4a2e15, #000); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 50;}
        .title { font-size: 4rem; color: #ff8800; font-weight: 900; letter-spacing: 5px; text-shadow: 0 0 20px rgba(255,100,0,0.8); margin-bottom: 10px; text-align: center;}
        .subtitle { color: #ddaa77; font-size: 1.2rem; margin-bottom: 40px; text-align: center; }
        #btn-start { padding: 15px 40px; font-size: 2rem; background: #ff5500; color: white; border: 2px solid #ffaa00; border-radius: 5px; cursor: pointer; box-shadow: 0 5px 15px rgba(255,85,0,0.5); }
        #btn-start:active { transform: scale(0.95); }

        /* HUD */
        #hud { display: none; width: 100%; height: 100%; position: absolute; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 4px; height: 4px; background: #00ff00; border-radius: 50%; box-shadow: 0 0 5px black; }
        
        /* LUNETA SCOPE */
        #scope-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 30%, black 70%); }
        #scope-lines { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%; }
        #scope-lines::before { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: rgba(255,0,0,0.8); }
        #scope-lines::after { content: ''; position: absolute; top: 0; left: 50%; width: 2px; height: 100%; background: rgba(255,0,0,0.8); }

        .hud-top { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-left: 5px solid #00ff00; color: white; font-size: 1.5rem; border-radius: 5px;}
        .hud-bottom { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-right: 5px solid #ffaa00; color: white; text-align: right; border-radius: 5px;}
        #weapon-name { font-size: 1.2rem; color: #ffaa00; }
        #ammo-count { font-size: 2.5rem; font-weight: 900; }
        
        #interact-msg { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); border: 1px solid #ffaa00; color: white; padding: 5px 15px; border-radius: 5px; font-size: 1.2rem; display: none; }
        #damage-flash { position: absolute; width: 100%; height: 100%; background: red; opacity: 0; transition: opacity 0.1s; pointer-events: none;}

        /* MOBILE CONTROLS */
        .mobile-ui { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .touch-zone { position: absolute; top: 0; width: 50%; height: 100%; pointer-events: auto; }
        #left-zone { left: 0; } #right-zone { right: 0; }
        
        #joystick-base { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; display: none; pointer-events: none;}
        #joystick-stick { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(255,255,255,0.5); border-radius: 50%; transform: translate(-50%, -50%); }
        
        .action-btn { position: absolute; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; color: white; font-size: 1rem; display: flex; align-items: center; justify-content: center; pointer-events: auto; transition: 0.1s;}
        .action-btn:active { background: rgba(255,100,0,0.6); border-color: #ff5500; transform: scale(0.9); }
        
        #btn-shoot { bottom: 30px; right: 30px; width: 80px; height: 80px; font-size: 1.5rem; background: rgba(255,51,0,0.5); border-color: #ff3300;}
        #btn-aim { bottom: 130px; right: 20px; width: 60px; height: 60px; background: rgba(0,150,255,0.4);}
        #btn-jump { bottom: 40px; right: 130px; width: 60px; height: 60px; }
        #btn-pickup { top: 20px; right: 90px; width: 60px; height: 60px; border-radius: 5px; background: rgba(0,255,0,0.3);}
        #btn-drop { top: 20px; right: 20px; width: 60px; height: 60px; border-radius: 5px; background: rgba(255,0,0,0.3);}
    </style>
</head>
<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <div id="ui-layer">
        <div id="damage-flash"></div>
        <div id="menu-screen">
            <h1 class="title">SAVANNA<br>STRIKE</h1>
            <p class="subtitle">Sobrevivência Selvagem</p>
            <button id="btn-start">ENTRAR NA SAVANA</button>
            <p style="color: #aaa; margin-top: 20px; text-align: center; padding: 20px;">
                PC: W,A,S,D (Mover) | Mouse Esquerdo (Atirar) | Mouse Direito (Mirar)<br>E (Pegar Arma) | G (Soltar)
            </p>
        </div>

        <div id="hud">
            <div id="scope-overlay"><div id="scope-lines"></div></div>
            <div id="crosshair"></div>
            <div id="interact-msg">Arma Detectada</div>
            
            <div class="hud-top">VIDA: <span id="hp-val">100</span></div>
            
            <div class="hud-bottom">
                <div id="weapon-name">PISTOLA</div>
                <div id="ammo-count">15</div>
            </div>

            <div class="mobile-ui" id="mobile-ui">
                <div class="touch-zone" id="left-zone"></div>
                <div class="touch-zone" id="right-zone"></div>
                
                <div id="joystick-base"><div id="joystick-stick"></div></div>
                
                <div id="btn-shoot" class="action-btn">Atirar</div>
                <div id="btn-aim" class="action-btn">Mirar</div>
                <div id="btn-jump" class="action-btn">Pular</div>
                <div id="btn-pickup" class="action-btn">Pegar</div>
                <div id="btn-drop" class="action-btn">Soltar</div>
            </div>
        </div>
    </div>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        // ==========================================
        // CONFIGURAÇÃO DE ARMAS (Dano e Zoom)
        // ==========================================
        const WEAPONS = {
            faca:    { name: "FACA DE CAÇA", type: "melee", dmg: 30, mag: '∞', delay: 500, zoom: 75, hasScope: false },
            pistola: { name: "GLOCK 19", type: "hitscan", dmg: 20, mag: 15, delay: 250, zoom: 60, hasScope: false },
            ak47:    { name: "AK-47 ASSAULT", type: "hitscan", dmg: 35, mag: 30, delay: 120, zoom: 50, hasScope: false },
            shotgun: { name: "SPAS-12", type: "hitscan", dmg: 80, mag: 8, delay: 800, zoom: 70, hasScope: false },
            sniper:  { name: "AWM SNIPER", type: "hitscan", dmg: 120, mag: 5, delay: 1500, zoom: 20, hasScope: true }
        };

        let scene, camera, renderer;
        let colliders = []; 
        let groundItems = [];
        let animals = [];
        
        let player = {
            pos: new THREE.Vector3(0, 2, 0),
            vel: new THREE.Vector3(0, 0, 0),
            height: 1.8, radius: 0.6, speed: 8,
            onGround: false, hp: 100,
            weapon: 'pistola', ammo: 15, lastShot: 0, isAiming: false
        };

        const raycaster = new THREE.Raycaster();
        const centerScreen = new THREE.Vector2(0, 0);

        // ==========================================
        // TEXTURAS PROCEDURAIS MODERNAS
        // ==========================================
        function createTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            if (type === 'dirt') {
                ctx.fillStyle = '#6b5428'; ctx.fillRect(0,0,512,512);
                for(let i=0; i<5000; i++) {
                    ctx.fillStyle = Math.random()>0.5 ? '#523f1c':'#826733';
                    ctx.fillRect(Math.random()*512, Math.random()*512, 3, 3);
                }
            } else if (type === 'wood') {
                ctx.fillStyle = '#3d2817'; ctx.fillRect(0,0,512,512);
                ctx.fillStyle = '#29180c';
                for(let i=0; i<100; i++) ctx.fillRect(0, Math.random()*512, 512, 3);
            } else if (type === 'leaves') {
                ctx.fillStyle = '#3a5f22'; ctx.fillRect(0,0,512,512);
                for(let i=0; i<2000; i++) {
                    ctx.fillStyle = Math.random()>0.5 ? '#2c4a19':'#4b782d';
                    ctx.beginPath(); ctx.arc(Math.random()*512, Math.random()*512, 5, 0, Math.PI*2); ctx.fill();
                }
            } else if (type === 'fur_lion') {
                ctx.fillStyle = '#d49a37'; ctx.fillRect(0,0,512,512);
                for(let i=0; i<1000; i++) {
                    ctx.fillStyle = '#a6721f'; ctx.fillRect(Math.random()*512, Math.random()*512, 10, 2);
                }
            } else if (type === 'fur_gazelle') {
                ctx.fillStyle = '#c49a6c'; ctx.fillRect(0,0,512,512);
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0,256,512,256); // Barriga branca
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        const matDirt = new THREE.MeshLambertMaterial({ map: createTexture('dirt') });
        const matWood = new THREE.MeshLambertMaterial({ map: createTexture('wood') });
        const matLeaves = new THREE.MeshLambertMaterial({ map: createTexture('leaves') });
        const matLion = new THREE.MeshLambertMaterial({ map: createTexture('fur_lion') });
        const matGazelle = new THREE.MeshLambertMaterial({ map: createTexture('fur_gazelle') });

        // Cores de armas
        const matMetal = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.4, metalness: 0.8 });
        const matWoodWeapon = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.9 });

        // ==========================================
        // CRIAR MODELOS 3D COMPOSTOS (Armas Realistas)
        // ==========================================
        function buildWeaponModel(type) {
            const group = new THREE.Group();
            if (type === 'ak47') {
                const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.6), matMetal);
                barrel.position.set(0, 0.05, -0.2);
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.15, 0.4), matMetal);
                body.position.set(0, 0, 0.1);
                const stock = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.1, 0.3), matWoodWeapon);
                stock.position.set(0, -0.05, 0.4);
                const mag = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.2, 0.1), matMetal);
                mag.position.set(0, -0.15, 0.05);
                mag.rotation.x = 0.2;
                group.add(barrel, body, stock, mag);
            } else if (type === 'sniper') {
                const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 1.2), matMetal);
                barrel.position.set(0, 0, -0.4);
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.12, 0.6), matWoodWeapon);
                body.position.set(0, -0.02, 0.2);
                const scope = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.3, 8), matMetal);
                scope.rotation.x = Math.PI / 2;
                scope.position.set(0, 0.1, 0.1);
                group.add(barrel, body, scope);
            } else if (type === 'shotgun') {
                const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.7), matMetal);
                barrel.position.set(0, 0.05, -0.2);
                const pump = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.2), matWoodWeapon);
                pump.position.set(0, 0.02, -0.2);
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.12, 0.3), matMetal);
                body.position.set(0, 0, 0.2);
                group.add(barrel, pump, body);
            } else { // Pistola
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.08, 0.25), matMetal);
                const grip = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.15, 0.08), matMetal);
                grip.position.set(0, -0.1, 0.05);
                grip.rotation.x = 0.2;
                group.add(body, grip);
            }
            return group;
        }

        let gunGroup = new THREE.Group();
        let currentGunMesh = null;

        function equipWeapon(weaponId, ammoCount) {
            player.weapon = weaponId;
            player.ammo = ammoCount !== undefined ? ammoCount : WEAPONS[weaponId].mag;
            
            if(currentGunMesh) gunGroup.remove(currentGunMesh);
            currentGunMesh = buildWeaponModel(weaponId);
            currentGunMesh.position.set(0.3, -0.25, -0.5); // Visão FPS
            gunGroup.add(currentGunMesh);
            
            // Resetar mira ao trocar de arma
            player.isAiming = false;
            camera.fov = 75;
            camera.updateProjectionMatrix();
            document.getElementById('scope-overlay').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';

            updateHUD();
        }

        // ==========================================
        // GERAÇÃO DO MUNDO (Savana)
        // ==========================================
        function createTree(x, z) {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 5, 8), matWood);
            trunk.position.set(x, 2.5, z);
            trunk.castShadow = true;
            scene.add(trunk);
            
            const leaves = new THREE.Mesh(new THREE.IcosahedronGeometry(3, 1), matLeaves);
            leaves.position.set(x, 6, z);
            leaves.castShadow = true;
            scene.add(leaves);

            const box = new THREE.Box3().setFromObject(trunk);
            colliders.push(box);
        }

        function createBush(x, z) {
            const bush = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5, 0), matLeaves);
            bush.position.set(x, 0.5, z);
            scene.add(bush);
        }

        function spawnGroundItem(weaponId, x, z) {
            const mesh = buildWeaponModel(weaponId);
            mesh.position.set(x, 0.5, z);
            // Rotacionar para deitar no chão
            mesh.rotation.x = Math.PI / 2;
            scene.add(mesh);
            groundItems.push({ mesh: mesh, id: weaponId, ammo: WEAPONS[weaponId].mag });
        }

        // ==========================================
        // SISTEMA DE ANIMAIS (IA e Barra de Vida)
        // ==========================================
        function createHealthBarCanvas() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'red'; ctx.fillRect(0,0,128,32);
            ctx.fillStyle = 'green'; ctx.fillRect(0,0,128,32);
            ctx.strokeStyle = 'white'; ctx.lineWidth = 4; ctx.strokeRect(0,0,128,32);
            return canvas;
        }

        class Animal {
            constructor(type, x, z) {
                this.type = type;
                this.hp = type === 'lion' ? 100 : 40;
                this.maxHp = this.hp;
                this.state = 'idle'; // idle, chase, flee, dead
                this.speed = type === 'lion' ? 6 : 9;
                
                // Construir modelo composto
                this.mesh = new THREE.Group();
                const mat = type === 'lion' ? matLion : matGazelle;
                
                // Corpo
                const bodySize = type === 'lion' ? [1.2, 1, 2] : [0.8, 0.8, 1.5];
                const body = new THREE.Mesh(new THREE.BoxGeometry(...bodySize), mat);
                body.position.y = bodySize[1]/2 + 0.8;
                body.castShadow = true;
                this.mesh.add(body);
                
                // Cabeça
                const headSize = type === 'lion' ? [0.8, 0.8, 0.8] : [0.4, 0.6, 0.6];
                const head = new THREE.Mesh(new THREE.BoxGeometry(...headSize), mat);
                head.position.set(0, body.position.y + 0.5, bodySize[2]/2 + 0.2);
                this.mesh.add(head);

                this.mesh.position.set(x, 0, z);
                scene.add(this.mesh);

                // Barra de Vida Sprite
                this.hpCanvas = createHealthBarCanvas();
                this.hpTexture = new THREE.CanvasTexture(this.hpCanvas);
                const spriteMat = new THREE.SpriteMaterial({ map: this.hpTexture });
                this.hpSprite = new THREE.Sprite(spriteMat);
                this.hpSprite.scale.set(2, 0.5, 1);
                this.hpSprite.position.y = body.position.y + 1.5;
                this.mesh.add(this.hpSprite);

                // Hitbox para tiro
                this.hitbox = new THREE.Box3();
            }

            takeDamage(dmg) {
                if(this.state === 'dead') return;
                this.hp -= dmg;
                
                // Atualizar textura da barra de vida
                const ctx = this.hpCanvas.getContext('2d');
                ctx.fillStyle = 'red'; ctx.fillRect(0,0,128,32);
                ctx.fillStyle = '#00ff00'; ctx.fillRect(0,0,128 * (this.hp/this.maxHp),32);
                ctx.strokeStyle = 'white'; ctx.lineWidth = 4; ctx.strokeRect(0,0,128,32);
                this.hpTexture.needsUpdate = true;

                if (this.hp <= 0) {
                    this.state = 'dead';
                    this.mesh.rotation.z = Math.PI / 2; // Cai de lado
                    this.hpSprite.visible = false; // Esconder barra
                } else {
                    // Fica agressivo ou foge ao tomar tiro
                    this.state = this.type === 'lion' ? 'chase' : 'flee';
                }
            }

            update(dt) {
                if(this.state === 'dead') return;
                
                this.hitbox.setFromObject(this.mesh);
                const distToPlayer = this.mesh.position.distanceTo(player.pos);

                // Comportamento
                if (this.type === 'lion') {
                    if (distToPlayer < 20) this.state = 'chase';
                    
                    if (this.state === 'chase') {
                        this.mesh.lookAt(player.pos.x, this.mesh.position.y, player.pos.z);
                        if (distToPlayer > 2) {
                            this.mesh.translateZ(this.speed * dt); // Move para frente
                        } else {
                            // Morder o player
                            if(Math.random() < 0.05) {
                                player.hp -= 10;
                                document.getElementById('damage-flash').style.opacity = 0.5;
                                setTimeout(() => document.getElementById('damage-flash').style.opacity = 0, 100);
                                updateHUD();
                            }
                        }
                    }
                } else if (this.type === 'gazelle') {
                    if (distToPlayer < 15) this.state = 'flee';
                    
                    if (this.state === 'flee') {
                        // Corre na direção oposta
                        const dir = this.mesh.position.clone().sub(player.pos).normalize();
                        const target = this.mesh.position.clone().add(dir);
                        this.mesh.lookAt(target.x, this.mesh.position.y, target.z);
                        this.mesh.translateZ(this.speed * dt);
                    }
                }
            }
        }

        function initGame() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            
            if (isMobile) document.getElementById('mobile-ui').style.display = 'block';
            else document.body.requestPointerLock();

            // Configuração da Cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xe0a96d); // Cor de Savana
            scene.fog = new THREE.FogExp2(0xe0a96d, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';
            scene.add(camera);
            camera.add(gunGroup);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Luzes Quentes (Sol)
            const ambient = new THREE.AmbientLight(0xffeedd, 0.5);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffddaa, 1.0);
            sun.position.set(100, 150, 50);
            sun.castShadow = true;
            sun.shadow.camera.left = -100; sun.shadow.camera.right = 100;
            sun.shadow.camera.top = 100; sun.shadow.camera.bottom = -100;
            scene.add(sun);

            // Chão de Terra
            const floorGeo = new THREE.PlaneGeometry(300, 300);
            matDirt.map.repeat.set(50, 50);
            const floor = new THREE.Mesh(floorGeo, matDirt);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Gerar Natureza
            for(let i=0; i<30; i++) {
                let x = (Math.random() - 0.5) * 200;
                let z = (Math.random() - 0.5) * 200;
                if(Math.abs(x) > 10 && Math.abs(z) > 10) createTree(x, z);
            }
            for(let i=0; i<50; i++) {
                createBush((Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200);
            }

            // Gerar Animais
            animals.push(new Animal('lion', 20, -30));
            animals.push(new Animal('lion', -40, 20));
            animals.push(new Animal('gazelle', 15, 40));
            animals.push(new Animal('gazelle', -25, -25));
            animals.push(new Animal('gazelle', 30, 10));

            // Armas no Chão
            spawnGroundItem('ak47', 5, -5);
            spawnGroundItem('shotgun', -10, 8);
            spawnGroundItem('sniper', 15, 15);

            equipWeapon('pistola');
            animate();
        }

        // ==========================================
        // LÓGICA DE TIRO, MIRA E INTERAÇÃO
        // ==========================================
        function toggleAim() {
            const data = WEAPONS[player.weapon];
            player.isAiming = !player.isAiming;
            
            if (player.isAiming) {
                camera.fov = data.zoom;
                if (data.hasScope) {
                    document.getElementById('scope-overlay').style.display = 'block';
                    document.getElementById('crosshair').style.display = 'none';
                    if(currentGunMesh) currentGunMesh.visible = false;
                } else {
                    // Mover arma para o centro se não tiver luneta escura
                    if(currentGunMesh) currentGunMesh.position.set(0, -0.15, -0.4);
                }
            } else {
                camera.fov = 75;
                document.getElementById('scope-overlay').style.display = 'none';
                document.getElementById('crosshair').style.display = 'block';
                if(currentGunMesh) {
                    currentGunMesh.visible = true;
                    currentGunMesh.position.set(0.3, -0.25, -0.5);
                }
            }
            camera.updateProjectionMatrix();
        }

        function fireWeapon() {
            const data = WEAPONS[player.weapon];
            const now = performance.now();
            if (now - player.lastShot < data.delay) return;
            if (player.ammo <= 0 && data.type !== 'melee') return;

            player.lastShot = now;
            if(data.type !== 'melee') player.ammo--;
            updateHUD();

            // Recuo Visual
            if(currentGunMesh && !data.hasScope) {
                currentGunMesh.position.z += 0.1;
                setTimeout(() => currentGunMesh.position.z -= 0.1, 50);
            }

            // Raycaster para acertar animais
            raycaster.setFromCamera(centerScreen, camera);
            
            // Extrair as malhas dos animais vivos
            const animalMeshes = animals.filter(a => a.state !== 'dead').map(a => a.mesh);
            const intersects = raycaster.intersectObjects(animalMeshes, true); // true para verificar os grupos (caixas que formam o animal)

            if (intersects.length > 0) {
                // Encontrar a qual animal a parte atingida pertence
                const hitMesh = intersects[0].object;
                const animalHit = animals.find(a => a.mesh.children.includes(hitMesh));
                if (animalHit) animalHit.takeDamage(data.dmg);
            }
        }

        function checkGroundItems() {
            raycaster.setFromCamera(centerScreen, camera);
            // Filtrar apenas o próprio Group da arma
            const meshes = groundItems.map(i => i.mesh);
            // Verificar colisão com os filhos (peças da arma)
            const intersects = raycaster.intersectObjects(meshes, true);
            
            const msg = document.getElementById('interact-msg');
            itemToPick = null;

            if (intersects.length > 0 && intersects[0].distance < 5) {
                const hitObj = intersects[0].object;
                // Achar o Group pai correspondente ao hitObj
                itemToPick = groundItems.find(i => i.mesh === hitObj || i.mesh.children.includes(hitObj));
                if(itemToPick) {
                    msg.innerText = `[E/PEGAR] ${WEAPONS[itemToPick.id].name}`;
                    msg.style.display = 'block';
                }
            } else {
                msg.style.display = 'none';
            }
        }

        function dropCurrentWeapon() {
            if(player.weapon === 'faca') return;
            if(player.isAiming) toggleAim(); // Tira a mira antes de jogar fora
            const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
            const dropPos = camera.position.clone().add(dir.multiplyScalar(2));
            spawnGroundItem(player.weapon, dropPos.x, dropPos.z);
            equipWeapon('faca');
        }

        function updateHUD() {
            document.getElementById('hp-val').innerText = player.hp;
            document.getElementById('weapon-name').innerText = WEAPONS[player.weapon].name;
            document.getElementById('ammo-count').innerText = WEAPONS[player.weapon].type === 'melee' ? '∞' : player.ammo;
            
            if(player.hp <= 0) {
                document.exitPointerLock();
                document.getElementById('menu-screen').innerHTML = "<h1 class='title' style='color:red;'>VOCÊ FOI CAÇADO</h1><button id='btn-start' onclick='location.reload()'>TENTAR NOVAMENTE</button>";
                document.getElementById('menu-screen').style.display = 'flex';
                document.getElementById('hud').style.display = 'none';
            }
        }

        // ==========================================
        // CONTROLES
        // ==========================================
        let keys = { w:false, a:false, s:false, d:false };
        
        // Teclado/Mouse (PC)
        document.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if(keys.hasOwnProperty(k)) keys[k] = true;
            if(k === ' ' && player.onGround) { player.vel.y = 10; player.onGround = false; }
            if(k === 'e' && itemToPick) {
                if(player.weapon !== 'faca') dropCurrentWeapon();
                equipWeapon(itemToPick.id, itemToPick.ammo);
                scene.remove(itemToPick.mesh);
                groundItems = groundItems.filter(i => i !== itemToPick);
            }
            if(k === 'g') dropCurrentWeapon();
        });
        document.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if(keys.hasOwnProperty(k)) keys[k] = false;
        });

        document.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement) {
                if (e.button === 0) fireWeapon(); // Botão Esquerdo = Tiro
                if (e.button === 2) toggleAim();  // Botão Direito = Mira
            }
        });
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement) {
                // Diminuir sensibilidade se estiver mirando
                let sens = player.isAiming ? 0.0005 : 0.002;
                camera.rotation.y -= e.movementX * sens;
                camera.rotation.x -= e.movementY * sens;
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
            }
        });

        // Touch (Mobile)
        let joyActive = false, joyOrigin = {x:0, y:0}, joyDelta = {x:0, y:0};
        const leftZone = document.getElementById('left-zone');
        const rightZone = document.getElementById('right-zone');
        
        leftZone.addEventListener('touchstart', (e) => {
            const t = e.changedTouches[0]; joyActive = true; joyOrigin = { x: t.clientX, y: t.clientY };
            const base = document.getElementById('joystick-base');
            base.style.display = 'block'; base.style.left = (t.clientX - 60) + 'px'; base.style.top = (t.clientY - 60) + 'px';
        });
        leftZone.addEventListener('touchmove', (e) => {
            if(!joyActive) return;
            const t = e.changedTouches[0];
            let dx = t.clientX - joyOrigin.x, dy = t.clientY - joyOrigin.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist > 40) { dx = (dx/dist)*40; dy = (dy/dist)*40; }
            document.getElementById('joystick-stick').style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joyDelta = { x: dx/40, y: dy/40 };
        });
        leftZone.addEventListener('touchend', () => { joyActive = false; joyDelta = {x:0, y:0}; document.getElementById('joystick-base').style.display = 'none'; });

        let lastTouch = null;
        rightZone.addEventListener('touchstart', (e) => lastTouch = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY });
        rightZone.addEventListener('touchmove', (e) => {
            const t = e.changedTouches[0];
            if(lastTouch) {
                let sens = player.isAiming ? 0.002 : 0.005;
                camera.rotation.y -= (t.clientX - lastTouch.x) * sens;
                camera.rotation.x -= (t.clientY - lastTouch.y) * sens;
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
            }
            lastTouch = { x: t.clientX, y: t.clientY };
        });
        rightZone.addEventListener('touchend', () => lastTouch = null);

        // Botões Mobile
        document.getElementById('btn-shoot').addEventListener('touchstart', fireWeapon);
        document.getElementById('btn-aim').addEventListener('touchstart', toggleAim);
        document.getElementById('btn-jump').addEventListener('touchstart', () => { if(player.onGround){ player.vel.y = 10; player.onGround = false;} });
        document.getElementById('btn-drop').addEventListener('touchstart', dropCurrentWeapon);
        document.getElementById('btn-pickup').addEventListener('touchstart', () => {
            if(itemToPick) {
                if(player.weapon !== 'faca') dropCurrentWeapon();
                equipWeapon(itemToPick.id, itemToPick.ammo);
                scene.remove(itemToPick.mesh);
                groundItems = groundItems.filter(i => i !== itemToPick);
            }
        });

        // ==========================================
        // LOOP PRINCIPAL E FÍSICA
        // ==========================================
        const clock = new THREE.Clock();
        const pBox = new THREE.Box3();

        function checkCollision(pos) {
            pBox.setFromCenterAndSize(new THREE.Vector3(pos.x, pos.y - player.height/2, pos.z), new THREE.Vector3(player.radius, player.height, player.radius));
            for(let box of colliders) if(pBox.intersectsBox(box)) return true;
            return false;
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);

            // Movimento Jogador
            let mX = 0, mZ = 0;
            if(isMobile && joyActive) { mX = joyDelta.x; mZ = joyDelta.y; }
            else { if(keys.w) mZ = -1; if(keys.s) mZ = 1; if(keys.a) mX = -1; if(keys.d) mX = 1; }

            if(mX !== 0 || mZ !== 0) {
                const dir = new THREE.Vector3(mX, 0, mZ).normalize();
                const camR = camera.rotation.y;
                let curSpeed = player.isAiming ? player.speed * 0.5 : player.speed; // Anda devagar se mirar
                const fX = (dir.x * Math.cos(camR) + dir.z * Math.sin(camR)) * curSpeed * dt;
                const fZ = (dir.z * Math.cos(camR) - dir.x * Math.sin(camR)) * curSpeed * dt;

                let nX = new THREE.Vector3(player.pos.x + fX, player.pos.y, player.pos.z);
                let nZ = new THREE.Vector3(player.pos.x, player.pos.y, player.pos.z + fZ);

                if(!checkCollision(nX)) player.pos.x += fX;
                if(!checkCollision(nZ)) player.pos.z += fZ;
            }

            // Gravidade
            player.vel.y -= 25 * dt;
            player.pos.y += player.vel.y * dt;
            if (player.pos.y <= player.height) { player.pos.y = player.height; player.vel.y = 0; player.onGround = true; }
            
            camera.position.copy(player.pos);

            // IA Animais
            animals.forEach(a => a.update(dt));

            checkGroundItems();
            renderer.render(scene, camera);
        }

        document.getElementById('btn-start').addEventListener('click', initGame);
        window.addEventListener('resize', () => {
            if(camera) { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
        });
        document.addEventListener('contextmenu', e => e.preventDefault()); // Evitar menu do clique direito
    </script>
</body>
</html>
